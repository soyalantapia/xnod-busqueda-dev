<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desarrollador Full Stack · Xnod</title>
<meta name="description" content="La búsqueda de desarrollador full stack de Xnod se mudó. Te llevamos a la página nueva.">

<!-- Esta página se mudó a Render. El aviso, el JSON-LD de JobPosting, robots y sitemap
     viven ahora en rrhh-postulaciones.onrender.com, que es donde el formulario guarda
     de verdad. Acá NO va un segundo JobPosting: dos avisos del mismo puesto compiten
     entre sí en Google y el de esta página llevaba a un formulario por mailto que no
     llegaba al panel. -->
<link rel="canonical" href="https://rrhh-postulaciones.onrender.com/">
<meta http-equiv="refresh" content="0; url=https://rrhh-postulaciones.onrender.com/">
<meta name="robots" content="noindex, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{ --primary:#5614E0; --primary-dark:#4310B4; --ink:#14161A; --muted:#5C636E; --line:#E4E6EB; }
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:#FAFAFB; color:var(--ink);
  font-family:Poppins,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.6;
}
.caja{
  background:#fff; border:1px solid var(--line); border-radius:14px;
  padding:36px 32px; max-width:460px; width:100%; text-align:center;
}
h1{font-size:23px; line-height:1.25; margin:0 0 10px; font-weight:600}
p{margin:0 0 22px; color:var(--muted); font-size:15px}
a.btn{
  display:inline-block; background:var(--primary); color:#fff; text-decoration:none;
  font-weight:600; font-size:15px; padding:13px 26px; border-radius:9px;
}
a.btn:hover{background:var(--primary-dark)}
a.btn:focus-visible{outline:3px solid #B79BFF; outline-offset:2px}
.pie{margin:20px 0 0; font-size:13px; color:var(--muted)}
.pie a{color:var(--primary)}
</style>
</head>
<body>
  <main class="caja">
    <h1>La búsqueda se mudó</h1>
    <p>El aviso de Desarrollador Full Stack y el formulario de postulación ahora están acá.</p>
    <a class="btn" href="https://rrhh-postulaciones.onrender.com/">Ir al aviso</a>
    <p class="pie">¿Ibas a postularte? <a href="https://rrhh-postulaciones.onrender.com/postular.html">Andá directo al formulario</a>. La búsqueda cierra el 10 de septiembre de 2026.</p>
  </main>
  <script>location.replace('https://rrhh-postulaciones.onrender.com/');</script>
</body>
</html>
