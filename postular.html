<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postulación · Desarrollador Full Stack · Xnod</title>
<meta name="description" content="El formulario de postulación de Xnod se mudó. Te llevamos a la página nueva.">

<!-- El formulario que vivía acá enviaba por mailto: abría el correo del candidato y la
     postulación NO llegaba al panel, sin videos, sin puntaje y sin ficha. El formulario
     real está en Render y guarda en la base. Esta página queda sólo para no romper los
     enlaces que ya circularon. -->
<link rel="canonical" href="https://desarrollador.postulaciones.xnod.tech/postular.html">
<meta http-equiv="refresh" content="0; url=https://desarrollador.postulaciones.xnod.tech/postular.html">
<meta name="robots" content="noindex, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{ --primary:#5614E0; --primary-dark:#4310B4; --ink:#14161A; --muted:#5C636E; --line:#E4E6EB; }
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:#FAFAFB; color:var(--ink);
  font-family:Poppins,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.6;
}
.caja{
  background:#fff; border:1px solid var(--line); border-radius:14px;
  padding:36px 32px; max-width:460px; width:100%; text-align:center;
}
h1{font-size:23px; line-height:1.25; margin:0 0 10px; font-weight:600}
p{margin:0 0 22px; color:var(--muted); font-size:15px}
a.btn{
  display:inline-block; background:var(--primary); color:#fff; text-decoration:none;
  font-weight:600; font-size:15px; padding:13px 26px; border-radius:9px;
}
a.btn:hover{background:var(--primary-dark)}
a.btn:focus-visible{outline:3px solid #B79BFF; outline-offset:2px}
.pie{margin:20px 0 0; font-size:13px; color:var(--muted)}
.pie a{color:var(--primary)}
</style>
</head>
<body>
  <main class="caja">
    <h1>El formulario se mudó</h1>
    <p>Tu postulación se completa en la página nueva. Son 6 pasos cortos, unos 20 minutos.</p>
    <a class="btn" href="https://desarrollador.postulaciones.xnod.tech/postular.html">Ir al formulario</a>
    <p class="pie">¿Querés leer el puesto primero? <a href="https://desarrollador.postulaciones.xnod.tech/">Ver el aviso completo</a>. La búsqueda cierra el 10 de septiembre de 2026.</p>
  </main>
  <script>location.replace('https://desarrollador.postulaciones.xnod.tech/postular.html');</script>
</body>
</html>
